[package]
name = "refract-screener"
version = "1.1.6"
edition = "2021"
license = "MIT"
description = "Refract-screener: screenshot tool for Windows 11 that replaces Snipping Tool"

[[bin]]
name = "refract-screener"
path = "src/main.rs"

[[bin]]
name = "RefractScreenerSetup"
path = "src/bin/setup.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
libwebp-sys = "0.14.4"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_DataExchange",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Variant",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_WinRT",
  "Win32_Networking_WinHttp",
  "Foundation",
  "Foundation_Collections",
  "Foundation_Numerics",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "System_UserProfile",
  "Web_Http",
  "Web_Http_Headers",
  "UI_Notifications",
  "Data_Xml_Dom",
  "Win32_Media_Audio",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
